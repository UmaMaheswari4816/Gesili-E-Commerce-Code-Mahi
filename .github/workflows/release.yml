name: Release (build & push images)

# Builds a container image for every runnable service and pushes to GHCR.
# Triggers on a version tag (v*) or manual dispatch. CI (build+test) stays in ci.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GitHub Container Registry

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - service-registry
          - api-gateway
          - auth-service
          - product-service
          - inventory-service
          - cart-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy is optional and OFF by default — it only runs if a KUBE_CONFIG secret exists,
  # so the pipeline is safe in a repo with no cluster. Wire a real cluster to enable it.
  deploy:
    name: Deploy (Helm)
    needs: build-images
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — skip if no cluster configured
        id: guard
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "No KUBE_CONFIG secret; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up kubeconfig
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Set up Helm
        if: steps.guard.outputs.skip != 'true'
        uses: azure/setup-helm@v4

      - name: Helm upgrade --install
        if: steps.guard.outputs.skip != 'true'
        run: |
          helm upgrade --install gesili k8s/helm/gesili \
            --set global.imageTag=${{ github.ref_name }} \
            --set secrets.POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --set secrets.RAZORPAY_KEY_SECRET='${{ secrets.RAZORPAY_KEY_SECRET }}' \
            --set secrets.RAZORPAY_WEBHOOK_SECRET='${{ secrets.RAZORPAY_WEBHOOK_SECRET }}' \
            --wait --timeout 10m
