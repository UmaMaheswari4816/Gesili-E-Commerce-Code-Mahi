# =============================================================================
# product-service — local bootstrap config. Rest served by the Config Server
# (config-repo/product-service.yml).
# =============================================================================
server:
  port: ${PRODUCT_SERVICE_PORT:9002}

spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/gecili_product}
    username: ${POSTGRES_USER:gecili}
    password: ${POSTGRES_PASSWORD:gecili}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Elasticsearch read model.
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:9001/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
