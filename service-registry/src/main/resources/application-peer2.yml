# Clustered Eureka — peer 2 of 2. Run with: --spring.profiles.active=peer2
server:
  port: 8762

eureka:
  instance:
    hostname: peer2
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://peer1:8761/eureka/
  server:
    enable-self-preservation: true
