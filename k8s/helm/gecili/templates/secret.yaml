# Secret holding DB credentials + payment keys. Values are supplied at deploy time via
# -f secrets.prod.yaml or --set (NEVER commit real values). In production prefer an
# external-secrets / sealed-secrets operator feeding from the cloud secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    {{- include "gecili.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
