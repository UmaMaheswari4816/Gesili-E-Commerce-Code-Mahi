# Prometheus scrape config. Services expose Micrometer metrics at
# /actuator/prometheus. Static targets are placeholders until Phase 9 wires
# real service discovery (or docker-sd). Adjust host.docker.internal for Linux.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot services (enabled per phase). host.docker.internal resolves the
  # Docker host from inside the container on Docker Desktop (Windows/macOS).
  - job_name: gesili-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8080"  # api-gateway
          - "host.docker.internal:8761"  # service-registry
          - "host.docker.internal:8888"  # config-server
          - "host.docker.internal:9001"  # auth-service
          - "host.docker.internal:9002"  # product-service
          - "host.docker.internal:9003"  # inventory-service
          - "host.docker.internal:9004"  # cart-service
          - "host.docker.internal:9005"  # order-service
          - "host.docker.internal:9006"  # payment-service
          - "host.docker.internal:9007"  # notification-service
