# =============================================================================
# Gesili E-Commerce — single Compose file, driven by PROFILES.
#
# Each phase profile is SELF-CONTAINED: it includes its own backing-service
# dependencies, so `docker compose --profile phaseN up` brings up everything that
# phase needs with no manual ordering. Profiles compose additively.
#
#   docker compose --profile infra up -d         # backing services only
#   docker compose --profile observability up -d  # Prometheus/Grafana/Loki/Promtail
#   docker compose --profile phase1 up -d         # Phase 1: infra for building/testing
#   docker compose --profile full up -d           # everything
#
# App services (config-server, registry, gateway, the business services) are added
# to this file in their respective phases; their profiles already appear below so
# the phase mapping is stable from the start.
#
# Run from the `infra/` directory. Values come from ../.env (copy from ../.env.example).
# =============================================================================

name: gesili-ecommerce

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — one server; a database per service is created by the init script.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gesili-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gesili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesili}
      # Databases to create on first boot (one per service that uses Postgres).
      GESILI_DATABASES: auth,product,inventory,order,payment,notification
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gesili}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [infra, phase1, phase2, phase3, phase4, phase5, phase6, phase7, full]

  # ---------------------------------------------------------------------------
  # Redis — cart storage, gateway rate limiting, caching.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gesili-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [infra, phase1, phase3, phase4, phase5, full]

  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode — no ZooKeeper). Event bus for the saga.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: gesili-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: gesili-kraft-cluster-0001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    profiles: [infra, phase1, phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Elasticsearch — product search read model (CQRS).
  # Single node, security disabled: DEV ONLY.
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: gesili-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    profiles: [infra, phase1, phase4, full]

  # ---------------------------------------------------------------------------
  # Zipkin — distributed tracing collector/UI.
  # ---------------------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:3
    container_name: gesili-zipkin
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    profiles: [infra, phase1, phase9, full]

  # ---------------------------------------------------------------------------
  # Config Server (Phase 2) — serves config-repo/ via the native backend.
  # Build context is the repo root so the parent POM + common-lib are reachable.
  # config-repo is mounted read-only; search-locations defaults include /config-repo.
  # ---------------------------------------------------------------------------
  config-server:
    build:
      context: ..
      dockerfile: config-server/Dockerfile
    image: gesili/config-server:0.1.0
    container_name: gesili-config-server
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
      EUREKA_CLIENT_ENABLED: "false"
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    volumes:
      - ../config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    profiles: [phase2, phase3, phase4, phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Service Registry / Eureka (Phase 2). Imports config from config-server.
  # ---------------------------------------------------------------------------
  service-registry:
    build:
      context: ..
      dockerfile: service-registry/Dockerfile
    image: gesili/service-registry:0.1.0
    container_name: gesili-service-registry
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    profiles: [phase2, phase3, phase4, phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Auth service (Phase 3). Needs Postgres + config-server + registry.
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    image: gesili/auth-service:0.1.0
    container_name: gesili-auth-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/gesili_auth
      POSTGRES_USER: ${POSTGRES_USER:-gesili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesili}
    ports:
      - "${AUTH_SERVICE_PORT:-9001}:9001"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9001/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 50s
    profiles: [phase3, phase4, phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # API Gateway (Phase 3). Needs Redis + registry; validates JWTs via auth JWKS.
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    image: gesili/api-gateway:0.1.0
    container_name: gesili-api-gateway
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      REDIS_HOST: redis
      JWKS_URI: http://auth-service:9001/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 50s
    profiles: [phase3, phase4, phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Product service (Phase 4). Needs Postgres + Elasticsearch + config + registry.
  # ---------------------------------------------------------------------------
  product-service:
    build:
      context: ..
      dockerfile: product-service/Dockerfile
    image: gesili/product-service:0.1.0
    container_name: gesili-product-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/gesili_product
      POSTGRES_USER: ${POSTGRES_USER:-gesili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesili}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      JWKS_URI: http://auth-service:9001/.well-known/jwks.json
    ports:
      - "${PRODUCT_SERVICE_PORT:-9002}:9002"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9002/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 50s
    profiles: [phase4, phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Inventory service (Phase 5). Needs Postgres + config + registry.
  # ---------------------------------------------------------------------------
  inventory-service:
    build:
      context: ..
      dockerfile: inventory-service/Dockerfile
    image: gesili/inventory-service:0.1.0
    container_name: gesili-inventory-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/gesili_inventory
      POSTGRES_USER: ${POSTGRES_USER:-gesili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesili}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWKS_URI: http://auth-service:9001/.well-known/jwks.json
    ports:
      - "${INVENTORY_SERVICE_PORT:-9003}:9003"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9003/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 50s
    profiles: [phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Cart service (Phase 5). Needs Redis + config + registry.
  # ---------------------------------------------------------------------------
  cart-service:
    build:
      context: ..
      dockerfile: cart-service/Dockerfile
    image: gesili/cart-service:0.1.0
    container_name: gesili-cart-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      REDIS_HOST: redis
      JWKS_URI: http://auth-service:9001/.well-known/jwks.json
    ports:
      - "${CART_SERVICE_PORT:-9004}:9004"
    depends_on:
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9004/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 50s
    profiles: [phase5, phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Order service (Phase 6). Needs Postgres + Kafka + config + registry.
  # ---------------------------------------------------------------------------
  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    image: gesili/order-service:0.1.0
    container_name: gesili-order-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/gesili_order
      POSTGRES_USER: ${POSTGRES_USER:-gesili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesili}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWKS_URI: http://auth-service:9001/.well-known/jwks.json
    ports:
      - "${ORDER_SERVICE_PORT:-9005}:9005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9005/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: [phase6, phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Payment service (Phase 7). Needs Postgres + Kafka + config + registry.
  # Provider secrets come from .env (never committed).
  # ---------------------------------------------------------------------------
  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    image: gesili/payment-service:0.1.0
    container_name: gesili-payment-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/gesili_payment
      POSTGRES_USER: ${POSTGRES_USER:-gesili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesili}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWKS_URI: http://auth-service:9001/.well-known/jwks.json
      PAYMENT_DEFAULT_PROVIDER: ${PAYMENT_DEFAULT_PROVIDER:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${PAYMENT_SERVICE_PORT:-9006}:9006"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9006/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: [phase7, phase8, full]

  # ---------------------------------------------------------------------------
  # Notification service (Phase 8). Needs Postgres + Kafka + config + registry.
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    image: gesili/notification-service:0.1.0
    container_name: gesili-notification-service
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://service-registry:8761/eureka/
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/gesili_notification
      POSTGRES_USER: ${POSTGRES_USER:-gesili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesili}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-9007}:9007"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9007/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: [phase8, full]

  # ---------------------------------------------------------------------------
  # Observability stack (Phase 9). Profile: observability (and full).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gesili-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles: [observability, phase9, full]

  loki:
    image: grafana/loki:3.2.0
    container_name: gesili-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    profiles: [observability, phase9, full]

  promtail:
    image: grafana/promtail:3.2.0
    container_name: gesili-promtail
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    profiles: [observability, phase9, full]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: gesili-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    profiles: [observability, phase9, full]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  es-data:
  prometheus-data:
  loki-data:
  grafana-data:
